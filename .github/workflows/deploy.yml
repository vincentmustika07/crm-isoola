name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      - name: Install PHP dependencies for build
        run: /usr/local/lsws/lsphp84/bin/php8.4 /usr/bin/composer install --no-dev --optimize-autoloader --no-interaction

      - name: Add PHP 8.4 to PATH
        run: echo "/usr/local/lsws/lsphp84/bin" >> $GITHUB_PATH

      - name: Build assets
        run: npm run build

      - name: Deploy to VPS
        run: |
          set -e

          APP_DIR=/home/crm.isoola.com/crm-isoola
          PHP=/usr/local/lsws/lsphp84/bin/php8.4
          RUNNER_BUILD=/opt/github-runner/_work/crm-isoola/crm-isoola/public/build

          # Allow git to operate on a directory owned by a different user
          git config --global --add safe.directory $APP_DIR

          cd $APP_DIR

          # Pull latest code
          git pull origin main

          # Sync built assets — remove stale hashed files first to avoid accumulation
          rm -rf $APP_DIR/public/build
          cp -r $RUNNER_BUILD $APP_DIR/public/build

          # Install/update PHP dependencies (production only)
          $PHP /usr/bin/composer install --no-dev --optimize-autoloader --no-interaction

          # Ensure storage symlink exists
          $PHP artisan storage:link --force

          # Run any pending migrations
          $PHP artisan migrate --force

          # Clear & rebuild all caches
          $PHP artisan optimize

          echo "Deploy completed successfully!"
