name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PHP dependencies
        env:
          PHP_BINARY: /usr/local/lsws/lsphp84/bin/php8.4
        run: /usr/local/lsws/lsphp84/bin/php8.4 /usr/bin/composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: PATH=/usr/local/lsws/lsphp84/bin:$PATH npm run build

      - name: Deploy
        run: |
          set -e
          cd /home/crm.isoola.com/crm-isoola

          # Allow git to operate in this directory (different owner from runner user)
          git config --global --add safe.directory /home/crm.isoola.com/crm-isoola

          # Pull latest code
          git pull origin main

          # Copy built assets from runner workspace to app directory
          cp -r /opt/github-runner/_work/crm-isoola/crm-isoola/public/build /home/crm.isoola.com/crm-isoola/public/

          # Use PHP 8.4 binary from LiteSpeed
          PHP=/usr/local/lsws/lsphp84/bin/php8.4

          # Install/update PHP dependencies (skip dev)
          $PHP /usr/bin/composer install --no-dev --optimize-autoloader --no-interaction

          # Run any pending migrations
          $PHP artisan migrate --force

          # Clear & rebuild caches
          $PHP artisan config:cache
          $PHP artisan route:cache
          $PHP artisan view:cache
          $PHP artisan event:cache

          echo "Deploy completed successfully!"
