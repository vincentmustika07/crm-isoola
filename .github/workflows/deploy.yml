name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /home/crm.isoola.com/crm-isoola

            # Pull latest code
            git pull origin main

            # Use PHP 8.4 binary from LiteSpeed
            PHP=/usr/local/lsws/lsphp84/bin/php8.4

            # Install/update PHP dependencies (skip dev)
            $PHP /usr/bin/composer install --no-dev --optimize-autoloader --no-interaction

            # Run any pending migrations
            $PHP artisan migrate --force

            # Clear & rebuild caches
            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan view:cache
            $PHP artisan event:cache

            # Restart queue workers if any
            $PHP artisan queue:restart

            echo "Deploy completed successfully!"

      - name: Sync built assets to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: 'public/build/*'
          target: '/home/crm.isoola.com/crm-isoola/public/build'
          strip_components: 2
