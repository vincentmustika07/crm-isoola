name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    env:
      PHP: /usr/local/lsws/lsphp84/bin/php8.4
      APP_DIR: /home/crm.isoola.com/crm-isoola
      COMPOSER_ALLOW_SUPERUSER: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: $PHP /usr/bin/composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build assets
        run: npm run build

      - name: Sync code to app directory
        run: |
          set -e
          git config --global --add safe.directory $APP_DIR
          if [ ! -f "$APP_DIR/.env" ]; then
            echo "ERROR: $APP_DIR/.env not found. Create it on the server before deploying."
            exit 1
          fi
          cd $APP_DIR
          git pull origin main

      - name: Sync built assets
        run: |
          set -e
          if [ ! -f "$GITHUB_WORKSPACE/public/build/manifest.json" ]; then
            echo "ERROR: manifest.json not found in $GITHUB_WORKSPACE/public/build/"
            ls -la $GITHUB_WORKSPACE/public/ || true
            exit 1
          fi
          echo "Build manifest found. Asset count: $(ls $GITHUB_WORKSPACE/public/build/assets 2>/dev/null | wc -l)"
          sudo rsync -a --delete $GITHUB_WORKSPACE/public/build/ $APP_DIR/public/build/
          sudo chown -R lscpd:lscpd $APP_DIR/public/build
          echo "Assets synced successfully to $APP_DIR/public/build"

      - name: Sync vendor directory
        run: |
          set -e
          sudo rsync -a --delete $GITHUB_WORKSPACE/vendor/ $APP_DIR/vendor/
          sudo chown -R lscpd:lscpd $APP_DIR/vendor

      - name: Fix permissions
        run: |
          set -e
          mkdir -p $APP_DIR/storage/logs
          mkdir -p $APP_DIR/storage/framework/cache
          mkdir -p $APP_DIR/storage/framework/sessions
          mkdir -p $APP_DIR/storage/framework/views
          mkdir -p $APP_DIR/bootstrap/cache
          sudo chown -R lscpd:lscpd $APP_DIR/storage
          sudo chown -R lscpd:lscpd $APP_DIR/bootstrap/cache
          sudo chown lscpd:lscpd $APP_DIR/.env
          sudo chmod 640 $APP_DIR/.env

      - name: Run Laravel post-deploy commands
        run: |
          set -e
          $PHP $APP_DIR/artisan storage:link --force
          $PHP $APP_DIR/artisan migrate --force
          $PHP $APP_DIR/artisan config:clear
          $PHP $APP_DIR/artisan cache:clear
          $PHP $APP_DIR/artisan optimize

      - name: Restart OpenLiteSpeed
        run: sudo systemctl restart lsws

      - name: Verify deployment
        run: |
          echo "=== Deploy Summary ==="
          echo "App dir : $APP_DIR"
          echo "PHP     : $($PHP -r 'echo PHP_VERSION;')"
          echo "Branch  : $(cd $APP_DIR && git rev-parse --abbrev-ref HEAD)"
          echo "Commit  : $(cd $APP_DIR && git rev-parse --short HEAD)"
          echo "Build   : $(ls $APP_DIR/public/build/assets | wc -l) asset files"
          echo "====================="
          echo "Deploy completed successfully!"
