name: Deploy to VPS

on:
  push:
    branches: [main]

# rsync --delete tidak boleh jalan bersamaan
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: bash

    env:
      PHP: /usr/local/lsws/lsphp84/bin/php8.4
      APP_DIR: /home/crm.isoola.com/crm-isoola
      # Sengaja di luar APP_DIR: dump tidak boleh ikut tersapu rsync --delete
      # atau git reset --hard, dan tidak boleh bisa diunduh dari web
      # (karena itu jangan pernah taruh di bawah public/).
      BACKUP_DIR: /home/crm.isoola.com/db-backups
      # extUser/extGroup vhost crm.isoola.com. PHP web jalan sebagai user ini,
      # bukan lscpd, jadi dia yang harus bisa nulis storage/ + bootstrap/cache.
      WEB_GROUP: crmis5326

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Build di workspace, bukan di folder live, supaya tidak ada downtime
      - name: Install dependencies
        run: |
          npm ci
          $PHP /usr/bin/composer install --no-dev --optimize-autoloader --no-interaction

      # wayfinder butuh vendor/ + artisan, jadi setelah composer
      - name: Build assets
        run: npm run build

      # Kode salah bisa diperbaiki dengan push ulang; data tidak. migrate --force
      # jalan otomatis tiap deploy dan repo ini punya migrasi destruktif
      # (dropColumn villa_id) yang down()-nya cuma mengembalikan kolom kosong,
      # bukan isinya. Dump dulu, selagi DB masih utuh.
      - name: Backup database
        run: |
          cd "$APP_DIR"

          # Kredensial dibaca dari .env server supaya tidak ada rahasia yang
          # perlu diduplikasi ke GitHub Secrets.
          env_get() { sed -n "s/^$1=//p" .env | tail -n1 | tr -d "\"'\r"; }

          db=$(env_get DB_DATABASE)
          [ -n "$db" ] || { echo "::error::DB_DATABASE kosong di $APP_DIR/.env"; exit 1; }

          host=$(env_get DB_HOST); host=${host:-127.0.0.1}
          port=$(env_get DB_PORT); port=${port:-3306}

          # CyberPanel kadang hanya menyediakan mariadb-dump.
          dump=$(command -v mysqldump || command -v mariadb-dump) \
            || { echo "::error::mysqldump/mariadb-dump tidak ada di PATH"; exit 1; }

          # Induk /home/crm.isoola.com dimiliki crmis5326 mode drwx--x--x, jadi
          # runner boleh menembus tapi tidak boleh membuat folder di situ.
          # Foldernya harus dibuat root sekali, lalu diserahkan ke runner.
          if ! mkdir -p "$BACKUP_DIR" 2>/dev/null && [ ! -w "$BACKUP_DIR" ]; then
            echo "::error::$BACKUP_DIR belum ada / tidak bisa ditulis. Jalankan di server sebagai root, cukup sekali:"
            echo "  install -d -o github-runner -g github-runner -m 700 $BACKUP_DIR"
            exit 1
          fi

          # Password lewat file, bukan argv, supaya tidak terbaca lewat `ps`.
          cnf=$(mktemp); chmod 600 "$cnf"
          trap 'rm -f "$cnf"' EXIT
          printf '[client]\nuser=%s\npassword=%s\nhost=%s\nport=%s\n' \
            "$(env_get DB_USERNAME)" "$(env_get DB_PASSWORD)" "$host" "$port" > "$cnf"

          out="$BACKUP_DIR/db-$(date +%Y%m%d-%H%M%S).sql.gz"
          # --single-transaction: dump konsisten tanpa mengunci tabel, situs tidak freeze.
          "$dump" --defaults-extra-file="$cnf" --single-transaction --quick "$db" \
            | gzip > "$out"

          # Backup yang gagal dalam senyap lebih bahaya daripada tidak ada backup,
          # karena bikin merasa aman padahal tidak. Jadi batalkan sebelum migrate.
          [ -s "$out" ] || { echo "::error::dump kosong/gagal, migrate dibatalkan"; exit 1; }
          # 600, bukan 640: PHP web jalan sebagai grup crmis5326. Kalau dump bisa
          # dibaca grup itu, satu celah di aplikasi = seluruh isi DB terbaca.
          chmod 600 "$out"

          # Simpan 20 terbaru. Sengaja tidak 7: dump cuma terjadi saat deploy,
          # jadi kalau sehari push 7x, riwayat hari sebelumnya habis tersapu.
          ls -1t "$BACKUP_DIR"/db-*.sql.gz | tail -n +21 | xargs -r rm --
          echo "Backup: $out ($(du -h "$out" | cut -f1))"

      - name: Deploy to app directory
        run: |
          # Wajib: git menolak beroperasi di repo yang pemiliknya user lain.
          git config --global --add safe.directory "$APP_DIR"

          git -C "$APP_DIR" fetch --prune origin main
          git -C "$APP_DIR" reset --hard origin/main

          rsync -rltD -O --delete --chmod=D2775,F664 "$GITHUB_WORKSPACE/vendor/"       "$APP_DIR/vendor/"
          rsync -rltD -O --delete --chmod=D2775,F664 "$GITHUB_WORKSPACE/public/build/" "$APP_DIR/public/build/"

      - name: Migrate and cache
        run: |
          cd "$APP_DIR"

          # artisan jalan sebagai github-runner, PHP web sebagai $WEB_GROUP.
          # Keduanya cuma nyambung lewat grup, jadi file baru wajib group-writable.
          # Tanpa umask 002 file jadi 644 dan web gagal nulis log/cache/session
          # -> HTTP 500 tanpa satu baris pun di laravel.log.
          umask 002

          $PHP artisan migrate --force
          $PHP artisan storage:link
          $PHP artisan optimize

          chmod -R g+w storage bootstrap/cache 2>/dev/null || true

      - name: Restart OpenLiteSpeed
        run: sudo /usr/bin/systemctl restart lsws
