name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Deploy
        run: |
          set -e
          cd /home/crm.isoola.com/crm-isoola

          # Pull latest code
          git pull origin main

          # Use PHP 8.4 binary from LiteSpeed
          PHP=/usr/local/lsws/lsphp84/bin/php8.4

          # Install/update PHP dependencies (skip dev)
          $PHP /usr/bin/composer install --no-dev --optimize-autoloader --no-interaction

          # Run any pending migrations
          $PHP artisan migrate --force

          # Clear & rebuild caches
          $PHP artisan config:cache
          $PHP artisan route:cache
          $PHP artisan view:cache
          $PHP artisan event:cache

          # Copy built assets
          cp -r public/build /home/crm.isoola.com/crm-isoola/public/

          echo "Deploy completed successfully!"
